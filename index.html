<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Story for Kak Hayfa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            color: #590d22;
        }

        /* FLOATING PARTICLES */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 5s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* GAME CONTAINER */
        .game-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #ffb3c1;
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(201, 24, 74, 0.25);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        /* HEADER BADGE */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ffb3c1;
            padding-bottom: 10px;
        }

        .status-badge {
            background: #ff4d6d;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.8rem;
        }

        /* AVATAR STAGE */
        .character-stage {
            text-align: center;
            padding: 10px 0;
        }

        .character-avatar {
            font-size: 4.5rem;
            animation: bounce 2s infinite ease-in-out;
            display: inline-block;
            filter: drop-shadow(0 8px 15px rgba(255, 77, 109, 0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* DIALOGUE BOX */
        .dialogue-box {
            background: #fff0f3;
            border: 2px solid #ff4d6d;
            border-radius: 18px;
            padding: 15px;
            min-height: 110px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #590d22;
            font-weight: 600;
        }

        .speaker-tag {
            position: absolute;
            top: -12px;
            left: 15px;
            background: #ff758c;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.75rem;
        }

        /* CONTROLS & CHOICES */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-game {
            background: linear-gradient(135deg, #ff758c, #ff4d6d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
            transition: all 0.2s;
            text-align: center;
        }

        .btn-game:active { transform: scale(0.96); }

        .btn-choice {
            background: #ffffff;
            color: #c9184a;
            border: 2px solid #ff758c;
            box-shadow: none;
        }

        .btn-choice:hover {
            background: #fff0f3;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="game-header">
            <span class="status-badge">🌙 Misi: Rehat Kak Hayfa</span>
            <span style="font-size:0.8rem; font-weight:700; color:#c9184a;" id="stepCounter">Bab 1/4</span>
        </div>

        <div class="character-stage">
            <div class="character-avatar" id="avatarEmoji">🧸</div>
        </div>

        <div class="dialogue-box">
            <div class="speaker-tag" id="speakerName">Shaka</div>
            <div id="typewriterText">...</div>
        </div>

        <div class="controls" id="actionArea">
            <button class="btn-game" onclick="nextDialogue()">Lanjut ➡️</button>
        </div>
    </div>

    <script>
        const story = [
            {
                speaker: "Shaka",
                avatar: "🧸✨",
                text: "Halo Kak Hayfa sayang! Akhirnya shift malamnya kelar juga yaa...",
                counter: "Bab 1/4"
            },
            {
                speaker: "Shaka",
                avatar: "🥺💖",
                text: "Shaka tau pasti capek banget, dari semalem melotot & berjuang pas orang lain lagi tidur nyenyak...",
                counter: "Bab 2/4"
            },
            {
                speaker: "Shaka",
                avatar: "🫂🌸",
                text: "Tapi Kak Hayfa hebat banget selalu bisa laluin semuanya! Sekarang pilih, Kak Hayfa mau apa dari Shaka?",
                counter: "Bab 3/4",
                isChoice: true
            }
        ];

        let currentStep = 0;
        let isTyping = false;

        function createParticles() {
            const symbols = ['💖', '✨', '🌸', '☁️', '🧸', '🌙'];
            for (let i = 0; i < 12; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 3 + 3) + 's';
                p.style.fontSize = (Math.random() * 14 + 14) + 'px';
                document.body.appendChild(p);
            }
        }
        createParticles();

        function typeWriter(text, i = 0) {
            if (i === 0) {
                document.getElementById("typewriterText").innerHTML = "";
                isTyping = true;
            }
            if (i < text.length) {
                document.getElementById("typewriterText").innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 35);
            } else {
                isTyping = false;
            }
        }

        function renderStep() {
            const step = story[currentStep];
            document.getElementById("speakerName").innerText = step.speaker;
            document.getElementById("avatarEmoji").innerText = step.avatar;
            document.getElementById("stepCounter").innerText = step.counter;
            typeWriter(step.text);

            const actionArea = document.getElementById("actionArea");
            if (step.isChoice) {
                actionArea.innerHTML = `
                    <button class="btn-game btn-choice" onclick="makeChoice('peluk')">🫂 Minta Pelukan Hangat</button>
                    <button class="btn-game btn-choice" onclick="makeChoice('resep')">🍵 Buka Resep Tidur Nyenyak</button>
                    <button class="btn-game btn-choice" onclick="makeChoice('surat')">💌 Baca Surat Rahasia</button>
                `;
            } else {
                actionArea.innerHTML = `<button class="btn-game" onclick="nextDialogue()">Lanjut ➡️</button>`;
            }
        }

        function nextDialogue() {
            if (isTyping) return;
            if (currentStep < story.length - 1) {
                currentStep++;
                renderStep();
            }
        }

        function makeChoice(type) {
            const actionArea = document.getElementById("actionArea");
            document.getElementById("stepCounter").innerText = "Bab 4/4";

            if (type === 'peluk') {
                document.getElementById("avatarEmoji").innerText = "🫂❤️";
                typeWriter("Sending 1.000.000 Virtual Hugs! Shaka elus kepalanya yaa: 'Kerja bagus hari ini Kak Hayfa sayang, sekarang lepas capeknya & istirahat yaa...'");
            } else if (type === 'resep') {
                document.getElementById("avatarEmoji").innerText = "🍵🛏️";
                typeWriter("Resep Nyenyak: 1. Minum air/susu hangat 🥛 2. Cuci muka & badan 🧼 3. Pasang HP mode hening 📱 4. Tarik selimut tebal 🛌. Selamat tidur Kak Hayfa!");
            } else if (type === 'surat') {
                document.getElementById("avatarEmoji").innerText = "📜💖";
                typeWriter("Surat Rahasia: Makasih udah selalu berjuang keras ya sayang. Shaka bangga banget punya cewek sehebat Kak Hayfa. Mimpi indah cantiknya Shaka! ✨");
            }

            actionArea.innerHTML = `<button class="btn-game" onclick="resetGame()">🔄 Mainkan Lagi</button>`;
        }

        function resetGame() {
            currentStep = 0;
            renderStep();
        }

        // Start
        renderStep();
    </script>
</body>
</html>
